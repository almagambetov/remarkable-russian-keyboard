name: Synthetic installer tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y qt6-l10n-tools
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
        env:
          RK_QT_BIN: /usr/lib/qt6/bin
      - run: remarkable-russian-keyboard --help
      - run: sh -n rk_installer/device.sh
